[build-system]
requires = ["setuptools>=77"]  # 77+ for the SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "cdio-example-simple-svg-chart"
version = "0.1.0"
description = "Example changedetection.io plugin: replaces the restock price charts with a simple server-drawn SVG line"
license = "Apache-2.0"
requires-python = ">=3.11"
# No dependency on changedetection.io itself: install this into the same environment that runs it
# (it needs plugin API 0.3.0 or newer, changedetectionio.plugin_api.PLUGIN_API_VERSION, and the
# restock_diff chart hooks)
dependencies = []

# This is what makes changedetection.io load the plugin at startup
[project.entry-points.changedetectionio]
cdio_example_simple_svg_chart = "cdio_example_simple_svg_chart"

[tool.setuptools]
packages = ["cdio_example_simple_svg_chart"]
