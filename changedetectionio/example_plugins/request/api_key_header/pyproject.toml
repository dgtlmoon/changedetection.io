[build-system]
requires = ["setuptools>=77"]  # 77+ for the SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "cdio-example-api-key-header"
version = "0.1.0"
description = "Example changedetection.io plugin: a per-watch API key header, kept out of the watch's own settings"
license = "Apache-2.0"
requires-python = ">=3.11"
# No dependency on changedetection.io itself: install this into the same environment that runs it
# (it needs plugin API 0.7.0 or newer, changedetectionio.plugin_api.PLUGIN_API_VERSION)
dependencies = []

# This is what makes changedetection.io load the plugin at startup
[project.entry-points.changedetectionio]
cdio_example_api_key_header = "cdio_example_api_key_header"

[tool.setuptools]
packages = ["cdio_example_api_key_header"]

[tool.setuptools.package-data]
cdio_example_api_key_header = ["templates/cdio_example_api_key_header/*"]
