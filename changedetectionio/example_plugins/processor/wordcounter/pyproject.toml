[build-system]
requires = ["setuptools>=77"]  # 77+ for the SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "cdio-example-wordcounter"
version = "0.1.0"
description = "Example changedetection.io processor plugin: counts the words on a page"
license = "Apache-2.0"
requires-python = ">=3.11"
# No dependency on changedetection.io itself: install this into the same environment that runs it
# (it needs plugin API 0.2.0 or newer, changedetectionio.plugin_api.PLUGIN_API_VERSION)
dependencies = []

# This is what makes changedetection.io load the plugin at startup
[project.entry-points.changedetectionio]
cdio_example_wordcounter = "cdio_example_wordcounter"

[tool.setuptools]
packages = ["cdio_example_wordcounter"]

[tool.setuptools.package-data]
cdio_example_wordcounter = ["api.yaml"]
